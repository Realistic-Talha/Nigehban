[project]
name = "nigehban-api"
version = "0.1.0"
description = "Nigehban — Pakistan's AI-Powered Fact-Check, Scam-Detection & Deepfake-Verification API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "anthropic>=0.39.0",
    "celery[redis]",
    "redis>=5.0",
    "httpx",
    "python-multipart",
    "pydantic-settings",
    "pgvector>=0.3.0",
    "python-jose",
    "passlib",
    "pillow",
    "pytesseract",
    "duckduckgo-search>=6.0",
    "ddgs>=9.0",
    "fastembed>=0.4.0",
    "exifread>=3.0",
    "imagehash>=4.3",
    "opencv-python-headless>=4.10,<5",
    "transformers>=4.44",
    "torch",
    "feedparser>=6.0",
    "librosa>=0.10",
    "numpy>=1.26",
    "scikit-learn==1.6.1",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "onnxruntime>=1.17",
    "open_clip_torch>=2.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
